trajectory_interpolator:
  ros__parameters:
    # Real flight parameters (no sim_time)
    
    # Topic names
    path_topic: "/trajectory_path"
    odometry_topic: "/px4/odometry/out"
    offboard_control_mode_topic: "fmu/in/offboard_control_mode"
    vehicle_command_topic: "fmu/in/vehicle_command"
    trajectory_setpoint_topic: "/px4/trajectory_setpoint_enu"
    status_topic: "/trajectory_interpolator/status"
    
    # Filter parameters for trajectory interpolation (ffilter) - real flight tuning
    ref_jerk_max: 2.0          # Maximum jerk [m/s³] - conservative for real flight
    ref_acc_max: 1.0           # Maximum acceleration [m/s²] - conservative for real flight
    ref_vel_max: 1.0           # Maximum velocity [m/s] - conservative for real flight
    ref_omega: 1.0             # Filter frequency [rad/s] - smooth for real flight
    ref_zeta: 0.7              # Damping ratio
    
    # Yaw filter parameters
    ref_yaw_jerk_max: 1.0      # Maximum yaw jerk [rad/s³]
    ref_yaw_acc_max: 0.5       # Maximum yaw acceleration [rad/s²]
    ref_yaw_vel_max: 0.5       # Maximum yaw velocity [rad/s]
    
    # Control parameters
    control_frequency: 50.0    # Control loop frequency [Hz]
    waypoint_tolerance: 0.1    # Distance tolerance to consider waypoint reached [m] - precise for real flight
    yaw_tolerance: 0.1         # Yaw tolerance [rad]
    
    # TF2 transforms (like trajectory_planner)
    parent_transform: "map"
    child_transform: "odom"
    do_transform: true         # Enable/disable transform from map to odom
    tf_buffer_timeout: 0.5     # TF lookup timeout [s]

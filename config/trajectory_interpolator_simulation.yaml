trajectory_interpolator:
  ros__parameters:
    # Simulation parameters
    use_sim_time: true
    
    # Topic names
    path_topic: "/trajectory_path"
    odometry_topic: "/px4/odometry/out"  # Now px4_tf_pub will publish this correctly
    offboard_control_mode_topic: "fmu/in/offboard_control_mode"
    vehicle_command_topic: "fmu/in/vehicle_command"
    trajectory_setpoint_topic: "/px4/trajectory_setpoint_enu"
    status_topic: "/trajectory_interpolator/status"
    
    # Filter parameters for trajectory interpolation (ffilter) - axis-specific tuning
    # XY motion (horizontal) - increased responsiveness for zero steady-state error
    # --- SPEED PROFILES ---
    # To change the drone speed safely without drifting into walls, update ALL 5 parameters:
    #
    # PROFILE: Slow (0.5 m/s) - Original/Safe
    # ref_jerk_max: 0.4 | ref_acc_max: 0.25 | ref_vel_max: 0.5 | ref_omega: 1.5 | ref_zeta: 1.0
    #
    # PROFILE: Moderate (1.0 m/s) - Responsive
    # ref_jerk_max: 0.8 | ref_acc_max: 0.6  | ref_vel_max: 1.0 | ref_omega: 2.0 | ref_zeta: 1.0
    #
    # PROFILE: Fast (3.0 m/s) - Aggressive (Braking distance ~2.25m)
    # ref_jerk_max: 2.5 | ref_acc_max: 2.0  | ref_vel_max: 3.0 | ref_omega: 3.0 | ref_zeta: 1.0
    # ----------------------
    ref_jerk_max: 0.4          # Maximum jerk [m/s³] - increased for tighter turns
    ref_acc_max: 0.25           # Maximum acceleration [m/s²] - enough to brake in ~2.25m at 3m/s
    ref_vel_max: 0.5           # Maximum velocity [m/s] - fast horizontal speed
    ref_omega: 1.5             # Filter frequency [rad/s] - increased for faster waypoint tracking
    ref_zeta: 1.0              # Damping ratio - critically damped for optimal response
    
    # Z motion (vertical) - moderately responsive for smooth altitude changes
    # --- Z SPEED PROFILES ---
    # To change the vertical speed safely, update ALL 5 parameters:
    #
    # PROFILE: Slow (0.5 m/s) - Original/Safe
    # ref_jerk_max_z: 0.4 | ref_acc_max_z: 0.25 | ref_vel_max_z: 0.5 | ref_omega_z: 1.5 | ref_zeta_z: 1.0
    #
    # PROFILE: Moderate (1.0 m/s) - Responsive
    # ref_jerk_max_z: 0.8 | ref_acc_max_z: 0.6  | ref_vel_max_z: 1.0 | ref_omega_z: 2.0 | ref_zeta_z: 1.0
    #
    # PROFILE: Fast (3.0 m/s) - Aggressive
    # ref_jerk_max_z: 2.5 | ref_acc_max_z: 2.0  | ref_vel_max_z: 3.0 | ref_omega_z: 3.0 | ref_zeta_z: 1.0
    # ------------------------
    ref_jerk_max_z: 0.4        # Maximum Z jerk [m/s³]
    ref_acc_max_z: 0.25        # Maximum Z acceleration [m/s²]
    ref_vel_max_z: 0.5         # Maximum Z velocity [m/s]
    ref_omega_z: 1.5           # Z Filter frequency [rad/s]
    ref_zeta_z: 1.0            # Z Damping ratio
    
    # Takeoff specific limits (used only during the initial takeoff)
    takeoff_jerk_max_z: 0.4    # Slower jerk for safe takeoff
    takeoff_acc_max_z: 0.25    # Slower acceleration for safe takeoff
    takeoff_vel_max_z: 0.5     # Slower velocity for safe takeoff

    
    # Yaw filter parameters - prioritized for forward-looking drone
    ref_yaw_jerk_max: 0.6      # Maximum yaw jerk [rad/s³] - increased for quick orientation
    ref_yaw_acc_max: 0.3      # Maximum yaw acceleration [rad/s²] - increased for responsive yaw
    ref_yaw_vel_max: 0.5       # Maximum yaw velocity [rad/s] - increased for fast reorientation
    choose_final_yaw: true     # Use final waypoint yaw if in "flyto" mode

    # Control parameters
    control_frequency: 50.0    # Control loop frequency [Hz]
    waypoint_tolerance: 0.1    # Distance tolerance to consider waypoint reached [m]
    yaw_tolerance: 0.1         # Yaw tolerance [rad]
    vertical_movement_threshold: 0.2  # Threshold to detect vertical movements (takeoff/landing)
    resampling_distance: 0.3   # NEW: Path resampling distance [m] (30cm default)
    
    # TF2 transforms (like trajectory_planner)
    parent_transform: "drone/map"
    child_transform: "odom"
    do_transform: true         # Enable/disable transform from map to odom
    tf_buffer_timeout: 0.5     # TF lookup timeout [s]
    
    # Loiter and tilting parameters
    loiter_segment: 8
    tilting_goal_pitch_deg: -20.0   # Goal pitch angle for tilting multicopter [degrees]
    tilting_interp_rate: 0.05       # Interpolation rate for pitch adjustment [0-1]
    tilting_on_pitch_enabled: true  # Enable tilting multicopter behavior
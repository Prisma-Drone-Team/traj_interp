trajectory_interpolator:
  ros__parameters:
    # Simulation parameters
    use_sim_time: true
    
    # Topic names
    path_topic: "/trajectory_path"
    odometry_topic: "/px4/odometry/out"  # Now px4_tf_pub will publish this correctly
    offboard_control_mode_topic: "fmu/in/offboard_control_mode"
    vehicle_command_topic: "fmu/in/vehicle_command"
    trajectory_setpoint_topic: "/px4/trajectory_setpoint_enu"
    status_topic: "/trajectory_interpolator/status"
    
    # Filter parameters for trajectory interpolation (ffilter) - conservative tuning
    ref_jerk_max: 1.0          # Maximum jerk [m/s³] - reduced for smoother motion
    ref_acc_max: 0.5           # Maximum acceleration [m/s²] - reduced for gentler acceleration
    ref_vel_max: 0.5           # Maximum velocity [m/s] - as requested
    ref_omega: 0.8             # Filter frequency [rad/s] - less responsive for smoother motion
    ref_zeta: 0.9              # Damping ratio - higher for less overshoot
    
    # Yaw filter parameters - also made less aggressive
    ref_yaw_jerk_max: 0.8      # Maximum yaw jerk [rad/s³] - reduced
    ref_yaw_acc_max: 0.4       # Maximum yaw acceleration [rad/s²] - reduced
    ref_yaw_vel_max: 0.4       # Maximum yaw velocity [rad/s] - reduced
    
    # Control parameters
    control_frequency: 50.0    # Control loop frequency [Hz]
    waypoint_tolerance: 0.2    # Distance tolerance to consider waypoint reached [m] - slightly larger for gentler approach
    yaw_tolerance: 0.2         # Yaw tolerance [rad] - slightly larger
    
    # TF2 transforms (like trajectory_planner)
    parent_transform: "map"
    child_transform: "odom"
    do_transform: true         # Enable/disable transform from map to odom
    tf_buffer_timeout: 0.5     # TF lookup timeout [s]
